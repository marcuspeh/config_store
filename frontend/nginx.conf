server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for any unknown path so client-side
    # routes work after a deep link / refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API requests to the backend over the shared
    # config-store-net docker network. /api/health -> backend:6002/health.
    location /api/ {
        proxy_pass http://config_store:6002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Cache hashed Vite assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
