# nginx.conf for the config_store frontend container.
#
# The single substitution point is `BACKEND_UPSTREAM`, used to
# reverse-proxy `/api/*` to the FastAPI backend. Defaults are baked
# in at build time via `envsubst` so the config is also valid without
# any runtime overrides.
#
# Two modes:
#   1. Full docker-compose (both backend + frontend in containers on
#      the shared `config-store-net` network):
#         BACKEND_UPSTREAM=http://config_store:6002/   (default)
#   2. Backend running directly on the host, frontend in a container:
#         BACKEND_UPSTREAM=http://host.docker.internal:6002/
#
# `host.docker.internal` is a docker-provided DNS name that resolves
# to the host machine from inside any container on a default bridge
# network; it works out of the box on Docker Desktop and on Linux
# hosts started with `--add-host=host.docker.internal:host-gateway`.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for any unknown path so client-side
    # routes work after a deep link / refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API requests to the backend. /api/health -> backend:6002/health.
    location /api/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Cache hashed Vite assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
