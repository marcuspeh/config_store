# Frontend for the config_store admin UI.
#
# Exposed on host port 3000. The browser talks to a single origin
# (:3000); the bundled nginx reverse-proxies /api/* to the backend
# address given by $BACKEND_UPSTREAM (default: the docker-network
# hostname `config_store`).
#
# Run from frontend/:
#
#   # Option A — full stack in docker (backend also running in a
#   # container with hostname `config_store` on the config-store-net
#   # network):
#   docker compose up -d --build
#
#   # Option B — backend running directly on the host. Point the proxy
#   # at host.docker.internal so the in-container nginx can reach the
#   # host-side uvicorn:
#   BACKEND_UPSTREAM=http://host.docker.internal:6002/ \
#     docker compose up -d --build
#
# `host.docker.internal` works out of the box on Docker Desktop and on
# Linux hosts started with `--add-host=host.docker.internal:host-gateway`.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Relative path: requests go to /api/health, the proxy in
        # nginx.conf forwards them to the backend.
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: config_store_frontend:latest
    container_name: config_store_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      # Backend address inside the container. Defaults to the docker-
      # network hostname; override to host.docker.internal when the
      # backend runs on the host directly.
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-http://config_store:6002/}
    networks:
      - config-store-net

networks:
  config-store-net:
    external: true
