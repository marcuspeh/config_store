[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "config-store-sdk"
version = "0.1.0"
description = "Python SDK for the config_store service."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "marcuspeh" },
]
keywords = ["config", "config-store", "sdk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/config_store"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
